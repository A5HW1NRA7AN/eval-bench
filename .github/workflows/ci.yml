# Lint (undefined names, unused imports, syntax errors) and the offline tests on every push and pull request:
# no LLM, Ollama or Qdrant is needed (see tests/conftest.py).
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uvx ruff check --select F,E9 bench tests
      - run: uv run pytest -q
